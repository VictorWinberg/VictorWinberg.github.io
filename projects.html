<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Roboto:300,400,700">
  <link rel="stylesheet" type="text/css" href="../css/style.css">
  <script type="text/javascript" src="../js/tailwind.js"></script>
  <link rel="icon" href="../img/logo.png">
  <title>Victor Winberg Portfolio</title>
</head>

<body>
  <div class="container">
    <header>
      <input type="checkbox" id="drawer-toggle" />
      <label for="drawer-toggle">
        <span class="menu"></span>
      </label>

      <nav>
        <ul>
          <li>
            <a href="../me" class="logo">
              <img src="../img/common/logo.svg" alt="My github logotype of the letter V" />
            </a>
          </li>
          <li class="grow"></li>
          <li>
            <a href="mailto:victor.m.winberg@gmail.com">
              <img src="../img/icons/envelope.svg" alt="" class="nav-icon" aria-hidden="true" />
              <span class="nav-label">Email</span>
            </a>
          </li>
          <li>
            <a href="//github.com/victorwinberg">
              <img src="../img/icons/github.svg" alt="" class="nav-icon" aria-hidden="true" />
              <span class="nav-label">Github</span>
            </a>
          </li>
          <li>
            <a href="//www.linkedin.com/in/victorwinberg">
              <img src="../img/icons/linkedin.svg" alt="" class="nav-icon" aria-hidden="true" />
              <span class="nav-label">LinkedIn</span>
            </a>
          </li>
          <li>
            <a href="./gallery">
              <img src="../img/icons/gallery.svg" alt="" class="nav-icon" aria-hidden="true" />
              <span class="nav-label">Gallery</span>
            </a>
          </li>
          <li>
            <a href="./projects" class="active">
              <img src="../img/icons/projects.svg" alt="" class="nav-icon" aria-hidden="true" />
              <span class="nav-label">Projects</span>
            </a>
          </li>
          <li>
            <a href="./about">
              <img src="../img/icons/about.svg" alt="" class="nav-icon" aria-hidden="true" />
              <span class="nav-label">About</span>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="text-xl font-semibold">Projects</h1>
      <div class="my-5 h-1 rounded-sm bg-indigo-500"></div>

      <p id="projects-status" class="projects-status" aria-live="polite">Loading projects…</p>

      <div id="projects-list"></div>
    </main>

    <footer>
      <span>© Copyright
        <script>
          document.write(new Date().getFullYear());
        </script> | Victor Winberg
      </span>
    </footer>
  </div>

  <script type="text/javascript" src="../js/projects.js"></script>
</body>

</html>
